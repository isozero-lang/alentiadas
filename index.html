<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grandes Alentíadas 2026</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary: #ca8a04;
            --secondary: #1d4ed8;
            --accent: #15803d;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --joker: #db2777;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text); font-family: 'Urbanist', sans-serif; max-width: 500px; margin: 0 auto; padding-bottom: 60px; }

        header { 
            position: relative; background-color: #1e3a8a;
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80');
            background-size: cover; background-position: center;
            padding: 60px 20px 40px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 25px;
        }
        header h1 { font-family: 'Montserrat', sans-serif; font-weight: 900; color: #fff; font-size: 26px; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
        header .subtitle { font-size: 13px; color: #fde047; text-transform: uppercase; margin-top: 5px; font-family: 'Montserrat'; font-weight: 800; letter-spacing: 2px; }

        #connection_status { position: absolute; top: 20px; left: 20px; font-size: 10px; color: white; background: #eab308; padding: 5px 12px; border-radius: 12px; font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; transition: background 0.3s ease; }

        .container { padding: 0 16px; }
        
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-nav { padding: 14px; border-radius: 12px; border: none; font-family: 'Montserrat'; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-blue { background: var(--secondary); color: white; }
        .btn-white { background: white; color: var(--text-muted); border: 1px solid var(--border); }

        h2 { font-family: 'Montserrat', sans-serif; color: var(--secondary); font-size: 13px; margin: 25px 0 15px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; font-weight: 800; }
        h2::after { content: ''; flex-grow: 1; height: 2px; background: var(--border); }

        .card { background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); border-bottom: 4px solid var(--secondary); }
        .card.admin-card { border-bottom-color: var(--primary); }
        
        .progress-container { background: #e2e8f0; height: 12px; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s ease; }

        .leaderboard-table { width: 100%; border-collapse: collapse; }
        .leaderboard-table td { padding: 14px 0; border-bottom: 1px solid var(--border); }
        .rank { width: 45px; font-weight: 900; color: var(--secondary); font-family: 'Montserrat'; font-size: 18px; }
        .team-info { display: flex; flex-direction: column; gap: 4px; }
        .team-name { font-weight: 800; color: var(--text); font-size: 15px; }
        .score { text-align: right; font-weight: 900; color: var(--accent); font-family: 'Montserrat'; font-size: 20px; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .badge-item { background: #fef08a; color: #854d0e; font-size: 9px; font-family: 'Montserrat'; font-weight: 800; padding: 3px 6px; border-radius: 5px; border: 1px solid #fde047; }
        .joker-tag { background: #fce7f3; color: #9d174d; border-color: #fbcfe8; }

        .cat-card { margin-bottom: 25px; }
        .cat-header { background: #f1f5f9; padding: 8px 15px; border-radius: 10px; font-family: 'Montserrat'; font-size: 11px; font-weight: 800; color: var(--primary); display: flex; justify-content: space-between; margin-bottom: 12px; text-transform: uppercase; }
        
        .game-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--border); }
        .game-name { font-size: 14px; font-weight: 800; color: var(--text); }
        .game-type { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-family: 'Montserrat'; font-weight: 700; margin-top: 2px; }
        .joker-used-indicator { font-size: 9px; color: var(--joker); font-weight: 900; margin-left: 5px; }
        
        .btn-manage { background: #ffffff; color: var(--secondary); border: 2px solid var(--secondary); padding: 8px 16px; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 11px; cursor: pointer; font-weight: 800; text-transform: uppercase; transition: all 0.2s ease; outline: none; -webkit-appearance: none; }
        .btn-manage:hover { background: var(--secondary); color: #ffffff; }
        .btn-manage:active { transform: scale(0.96); }

        .status-done { color: var(--accent); font-family: 'Montserrat'; font-size: 11px; font-weight: 800; background: #dcfce7; padding: 6px 10px; border-radius: 6px; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
        .modal { background: white; border-radius: 24px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); border-bottom: 6px solid var(--secondary); max-height: 90vh; overflow-y: auto; }
        .modal h3 { font-family: 'Montserrat'; color: var(--secondary); text-align: center; margin-bottom: 20px; text-transform: uppercase; font-size: 16px; }
        
        .score-input-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .score-input-row span { font-weight: 800; font-size: 13px; }
        .score-input-row select, .score-input-row input { padding: 10px; border-radius: 8px; border: 2px solid var(--border); font-family: inherit; font-weight: 700; outline: none; font-size: 13px; }

        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn-action { flex: 1; padding: 15px; border-radius: 12px; border: none; font-family: 'Montserrat'; font-weight: 800; font-size: 12px; text-transform: uppercase; cursor: pointer; }
        .btn-confirm { background: var(--secondary); color: white; }
        .btn-cancel { background: #e2e8f0; color: var(--text-muted); }

        .timer-box { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .timer-display { font-family: 'Montserrat'; font-size: 32px; font-weight: 900; color: var(--primary); margin: 10px 0; }

        .admin-only { display: none; }
        body.admin-mode .admin-only { display: block; }
        
        .team-inputs { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .team-row-input { display: flex; align-items: center; gap: 10px; }
        .team-row-input label { font-family: 'Montserrat'; font-size: 11px; color: var(--text-muted); width: 85px; font-weight: 700; text-transform: uppercase; }
        .team-row-input input { flex-grow: 1; background: #f8fafc; border: 1px solid var(--border); color: var(--text); padding: 11px; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div id="connection_status">🟡 A Ligar...</div>
        <div id="badge_admin" class="admin-only" style="position:absolute; top:20px; right:20px; background:var(--danger); color:white; padding:4px 10px; border-radius:6px; font-family:'Montserrat'; font-size:10px; font-weight:900;">ADMIN</div>
        <h1>Grandes Alentíadas</h1>
        <div class="subtitle">De Verão 2026</div>
    </header>

    <div class="container">
        
        <div class="nav-grid">
            <button class="btn-nav btn-blue" onclick="toggleChart()">📊 Ver Evolução</button>
            <button class="btn-nav btn-white admin-only" onclick="resetTourney()">🗑️ Reset</button>
        </div>

        <div class="card" style="border-bottom-color: var(--accent);">
            <h3 style="font-family:'Montserrat'; font-size:11px; color:var(--accent); text-transform:uppercase;">Meta de Sucesso das Alentíadas</h3>
            <div id="success_label" style="font-size:14px; font-weight:800; margin-top:5px;">Categorias: 0 / 5</div>
            <div class="progress-container"><div id="success_bar" class="progress-fill"></div></div>
        </div>

        <div class="timer-box admin-only">
            <h3 style="font-family:'Montserrat'; font-size:10px; text-transform:uppercase; color:var(--primary);">Cronómetro de Prova</h3>
            <div class="timer-display" id="timer_val">00:00</div>
            <div style="display:flex; gap:5px; justify-content:center;">
                <button class="btn-nav btn-white" style="padding:6px 12px;" onclick="startTimer(60)">1m</button>
                <button class="btn-nav btn-white" style="padding:6px 12px;" onclick="startTimer(300)">5m</button>
                <button class="btn-nav btn-white" style="padding:6px 12px;" onclick="startTimer(2700)">45m</button>
                <button class="btn-nav btn-blue" style="padding:6px 12px; background:var(--danger);" onclick="stopTimer()">Stop</button>
            </div>
        </div>

        <div class="card admin-only admin-card">
            <h3 style="font-family:'Montserrat'; font-size:11px; text-transform:uppercase; color:var(--primary); margin-bottom:15px;">Nomes das Equipas</h3>
            <div class="team-inputs">
                <div class="team-row-input"><label>Equipa 1</label><input type="text" id="t1" onchange="updateTeams()"></div>
                <div class="team-row-input"><label>Equipa 2</label><input type="text" id="t2" onchange="updateTeams()"></div>
                <div class="team-row-input"><label>Equipa 3</label><input type="text" id="t3" onchange="updateTeams()"></div>
                <div class="team-row-input"><label>Solo</label><input type="text" id="t4" onchange="updateTeams()"></div>
            </div>
        </div>

        <h2>🏆 Classificação Geral</h2>
        <div class="card">
            <table class="leaderboard-table"><tbody id="leaderboard_body"></tbody></table>
        </div>

        <div id="game_categories"></div>
    </div>

    <div class="overlay" id="modal_score">
        <div class="modal">
            <h3 id="modal_title">Lançar Pontos</h3>
            <div id="modal_inputs"></div>
            
            <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
                <span style="font-size:11px; font-family:'Montserrat'; font-weight:800; color:var(--joker);">🃏 Ativar Joker nesta prova?</span>
                <div class="score-input-row" style="margin-top:10px; background:#fff1f2;">
                    <span>Quem usou:</span>
                    <select id="joker_picker"></select>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-action btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-action btn-confirm" onclick="saveMatch()">Gravar Resultados</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="modal_chart">
        <div class="modal" style="max-width:500px;">
            <h3>📈 Evolução das Alentíadas</h3>
            <div style="height:300px;"><canvas id="chart_canvas"></canvas></div>
            <button class="btn-action btn-cancel" style="width:100%; margin-top:20px;" onclick="toggleChart()">Fechar</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvR4SLU4hPnNu2mHYtaNV2RKc0F8SE1-w",
            authDomain: "alentiadas-de-verao-2026.firebaseapp.com",
            databaseURL: "https://alentiadas-de-verao-2026-default-rtdb.europe-west1.firebasedatabase.app/", 
            projectId: "alentiadas-de-verao-2026",
            storageBucket: "alentiadas-de-verao-2026.firebasestorage.app",
            messagingSenderId: "837106747078",
            appId: "1:837106747078:web:26756f7db700acfb1ef9c7",
            measurementId: "G-W68D8RZWGN"
        };

        const cats = [
            { id: "alem", name: "📸 Alembraduras", min: 2, games: [
                { id: "piscina", name: "Saltos Piscina", type: "qual", badge: "💦 Graciosidade Líquida" },
                { id: "sesta", name: "Concurso de Sestas", type: "qual", badge: "💤 Mestre do Sono" },
                { id: "video", name: "Videoclip Low-Cost", type: "qual", badge: "🎬 Spielberg Alentejano" },
                { id: "rap", name: "Rap de andar à unha", type: "qual", badge: "🎤 Slim Shady do Monte" },
                { id: "prancha", name: "Saltos da Prancha", type: "qual", badge: "🦅 Ícaro do Guadiana" },
                { id: "bronze", name: "Melhor Bronzeado", type: "qual", badge: "☀️ Lagarto de Poltrona" },
                { id: "piada", name: "Melhor Piada", type: "qual", badge: "🎭 Herman do Montado" }
            ]},
            { id: "canastro", name: "🫒 Dar ao Canastro", min: 1, games: [
                { id: "padel", name: "Padel Monsaraz", type: "pos", badge: "🎾 Dono do Campo" },
                { id: "karts", name: "Karts Alentejo", type: "kart", badge: "🏎️ F1 do Chouriço" },
                { id: "pesca", name: "Pesca no Alqueva", type: "pos", badge: "🎣 Encantador de Achigãs" }
            ]},
            { id: "maquineta", name: "🖥️ Moços da Maquineta", min: 2, games: [
                { id: "mk", name: "Mario Kart", type: "pos", badge: "🍌 Casca de Banana" },
                { id: "jd", name: "Just Dance", type: "pos", badge: "🕺 Rei do Ritmo" },
                { id: "bowl", name: "Bowling Switch", type: "pos", badge: "🎳 Strike d'Ouro" },
                { id: "fris", name: "Frisbee PS3", type: "pos", badge: "🥏 Aerodinâmica" }
            ]},
            { id: "sombra", name: "🪑 Sentados à Sombra", min: 1, games: [
                { id: "uno", name: "Campeonato de Uno", type: "pos", badge: "🃏 UNO com o UNIverso" },
                { id: "abalone", name: "Abalone", type: "pos", badge: "⚪ Mestre das Esferas" },
                { id: "monopolio", name: "Monopólio", type: "pos", badge: "🎩 Magnata do Latifúndio" }
            ]},
            { id: "patusca", name: "🧀 Patusca e Petisco", min: 1, games: [
                { id: "chef", name: "Melhor Chef", type: "qual", badge: "🥩 Chef do Montado" },
                { id: "comer", name: "Aspirador de Melancia", type: "pos", badge: "🍉 Devorador d'Alqueva" }
            ]}
        ];

        const ptsMap = { 1: 10, 2: 7, 3: 5, 4: 3 };
        const kartMap = { 1: 10, 2: 8, 3: 6, 4: 5, 5: 4, 6: 3, 7: 2 };

        let state = { names: {1:"Equipa 1", 2:"Equipa 2", 3:"Equipa 3", 4:"Cunhado Solo"}, matches: {}, history: [] };
        let isAdmin = new URLSearchParams(window.location.search).get('admin') === 'alentejo2026';
        let activeMatchId = null;
        let countdown;
        let chartInstance = null;

        if(isAdmin) document.body.classList.add('admin-mode');

        // Inicializa a Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Gere o Semáforo de Ligação
        db.ref('.info/connected').on('value', function(snap) {
            const connStatus = document.getElementById('connection_status');
            if (snap.val() === true) {
                connStatus.innerText = "🟢 Online";
                connStatus.style.background = "#15803d";
            } else {
                connStatus.innerText = "🔴 Offline";
                connStatus.style.background = "#ef4444";
            }
        });

        // Escutar a Base de Dados
        db.ref('alentiadas2026').on('value', snap => {
            const val = snap.val();
            if(val) {
                state = val;
                if(!state.matches) state.matches = {};
                if(!state.history) state.history = [];
                if(!state.names) state.names = {1:"Equipa 1", 2:"Equipa 2", 3:"Equipa 3", 4:"Cunhado Solo"};
            } else {
                state = { names: {1:"Equipa 1", 2:"Equipa 2", 3:"Equipa 3", 4:"Cunhado Solo"}, matches: {}, history: [] };
            }
            updateUI();
        });

        function updateTeams() {
            const names = { 
                1: document.getElementById('t1').value || "Equipa 1", 
                2: document.getElementById('t2').value || "Equipa 2", 
                3: document.getElementById('t3').value || "Equipa 3", 
                4: document.getElementById('t4').value || "Cunhado Solo" 
            };
            db.ref('alentiadas2026/names').set(names);
        }

        function updateUI() {
            if(isAdmin && document.activeElement && document.activeElement.tagName !== 'INPUT') {
                for(let i=1; i<=4; i++) document.getElementById(`t${i}`).value = state.names[i] || `Equipa ${i}`;
            }
            renderLeaderboard();
            renderGames();
        }

        function renderLeaderboard() {
            let totals = {1:0, 2:0, 3:0, 4:0};
            let earnedBadges = {1:[], 2:[], 3:[], 4:[]};
            let catsDone = new Set();
            let jokers = {1:false, 2:false, 3:false, 4:false};

            const allGames = cats.flatMap(c => c.games);

            state.history.forEach(mId => {
                const m = state.matches[mId];
                const g = allGames.find(x => x.id === mId);
                if(m && g) {
                    for(let i=1; i<=4; i++) {
                        let pointsGained = m.pts ? (m.pts[i] || 0) : 0;
                        totals[i] += pointsGained;
                        if((pointsGained === 10 || pointsGained === 20) && m.pts[i] !== 0) {
                            if(!earnedBadges[i].includes(g.badge)) earnedBadges[i].push(g.badge);
                        }
                    }
                    if(m.joker && m.joker !== "none") jokers[m.joker] = true;
                    
                    const category = cats.find(c => c.games.some(x => x.id === mId));
                    if(category) {
                        const doneInCat = state.history.filter(id => category.games.some(x => x.id === id)).length;
                        if(doneInCat >= category.min) catsDone.add(category.id);
                    }
                }
            });

            document.getElementById('success_label').innerText = `Categorias Cumpridas: ${catsDone.size} / 5`;
            document.getElementById('success_bar').style.width = (catsDone.size / 5 * 100) + "%";

            let sorted = [1,2,3,4].map(id => ({ id, name: state.names[id] || `Equipa ${id}`, score: totals[id], badges: earnedBadges[id], joker: jokers[id] }))
                                 .sort((a,b) => b.score - a.score);

            document.getElementById('leaderboard_body').innerHTML = sorted.map((t, i) => `
                <tr>
                    <td class="rank">${i+1}º</td>
                    <td>
                        <div class="team-info">
                            <span class="team-name">${t.name}</span>
                            <div class="badge-list">
                                ${t.joker ? '<span class="badge-item joker-tag">🃏 Trunfo</span>' : ''}
                                ${t.badges.map(b => `<span class="badge-item">${b}</span>`).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="score">${t.score} <small style="font-size:11px; font-weight:normal; color:var(--text-muted);">pts</small></td>
                </tr>
            `).join('');
        }

        function renderGames() {
            const container = document.getElementById('game_categories');
            container.innerHTML = cats.map(c => `
                <div class="cat-card">
                    <div class="cat-header"><span>${c.name}</span><span>Meta: ${c.min}</span></div>
                    ${c.games.map(g => {
                        const m = state.matches[g.id];
                        const done = !!m;
                        const jokerHtml = (done && m.joker && m.joker !== "none") ? `<span class="joker-used-indicator">🃏 Joker ${state.names[m.joker]}</span>` : '';
                        return `
                            <div class="game-row">
                                <div>
                                    <div class="game-name">${g.name} ${jokerHtml}</div>
                                    <div class="game-type">${g.type === 'qual' ? 'Notas Júri' : g.type === 'kart' ? 'Média Karts' : 'Posições'}</div>
                                </div>
                                <div>${done ? '<span class="status-done">✓ FEITO</span>' : `<button class="btn-manage admin-only" onclick="openScore('${g.id}')">Lançar</button>`}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `).join('');
        }

        function openScore(id) {
            activeMatchId = id;
            const g = cats.flatMap(c => c.games).find(x => x.id === id);
            document.getElementById('modal_title').innerText = g.name;
            let html = '';

            if(g.type === 'pos') {
                for(let i=1; i<=4; i++) html += `<div class="score-input-row"><span>${state.names[i]}</span><select id="s_${i}"><option value="1">1º Lugar</option><option value="2">2º Lugar</option><option value="3">3º Lugar</option><option value="4">4º Lugar</option></select></div>`;
            } else if(g.type === 'qual') {
                for(let i=1; i<=4; i++) html += `<div class="score-input-row"><span>${state.names[i]}</span><input type="number" id="v_${i}" step="0.1" value="7.0" min="0" max="10"></div>`;
            } else if(g.type === 'kart') {
                html += '<p style="font-size:11px; color:var(--danger); margin-bottom:12px; font-weight:700;">Indica a posição final na pista (1º ao 7º lugar):</p>';
                html += `<div class="score-input-row"><span>${state.names[1]} (Piloto A)</span><input type="number" id="k1a" value="1" min="1" max="7"></div>`;
                html += `<div class="score-input-row"><span>${state.names[1]} (Piloto B)</span><input type="number" id="k1b" value="7" min="1" max="7"></div>`;
                html += `<div class="score-input-row"><span>${state.names[2]} (Piloto A)</span><input type="number" id="k2a" value="4" min="1" max="7"></div>`;
                html += `<div class="score-input-row"><span>${state.names[2]} (Piloto B)</span><input type="number" id="k2b" value="6" min="1" max="7"></div>`;
                html += `<div class="score-input-row"><span>${state.names[3]} (Piloto A)</span><input type="number" id="k3a" value="3" min="1" max="7"></div>`;
                html += `<div class="score-input-row"><span>${state.names[3]} (Piloto B)</span><input type="number" id="k3b" value="5" min="1" max="7"></div>`;
                html += `<div class="score-input-row"><span><strong>${state.names[4]} (Solo)</strong></span><input type="number" id="k4" value="2" min="1" max="7"></div>`;
            }

            document.getElementById('modal_inputs').innerHTML = html;
            
            const usedJokers = state.history.map(hid => state.matches[hid] ? state.matches[hid].joker : "none").filter(j => j && j !== "none");
            let jHtml = '<option value="none">-- Ninguém --</option>';
            for(let i=1; i<=4; i++) {
                if(!usedJokers.includes(String(i))) jHtml += `<option value="${i}">${state.names[i]}</option>`;
            }
            document.getElementById('joker_picker').innerHTML = jHtml;
            document.getElementById('modal_score').style.display = 'flex';
        }

        function saveMatch() {
            const g = cats.flatMap(c => c.games).find(x => x.id === activeMatchId);
            let finalPts = {1:0, 2:0, 3:0, 4:0};

            if(g.type === 'pos') {
                for(let i=1; i<=4; i++) finalPts[i] = ptsMap[document.getElementById(`s_${i}`).value];
            } else if(g.type === 'qual') {
                let r = [1,2,3,4].map(id => ({ id, val: parseFloat(document.getElementById(`v_${id}`).value) || 0 })).sort((a,b) => b.val - a.val);
                r.forEach((t, i) => finalPts[t.id] = ptsMap[i+1]);
            } else if(g.type === 'kart') {
                let p1a = parseInt(document.getElementById('k1a').value) || 7;
                let p1b = parseInt(document.getElementById('k1b').value) || 7;
                let p2a = parseInt(document.getElementById('k2a').value) || 7;
                let p2b = parseInt(document.getElementById('k2b').value) || 7;
                let p3a = parseInt(document.getElementById('k3a').value) || 7;
                let p3b = parseInt(document.getElementById('k3b').value) || 7;
                let p4  = parseInt(document.getElementById('k4').value) || 7;

                let a1 = ((kartMap[p1a] || 2) + (kartMap[p1b] || 2)) / 2;
                let a2 = ((kartMap[p2a] || 2) + (kartMap[p2b] || 2)) / 2;
                let a3 = ((kartMap[p3a] || 2) + (kartMap[p3b] || 2)) / 2;
                let a4 = kartMap[p4] || 2;
                
                let r = [{id:1, v:a1}, {id:2, v:a2}, {id:3, v:a3}, {id:4, v:a4}].sort((a,b) => b.v - a.v);
                r.forEach((t, i) => finalPts[t.id] = ptsMap[i+1]);
            }

            const joker = document.getElementById('joker_picker').value;
            if(joker !== "none") finalPts[joker] *= 2;

            firebase.database().ref(`alentiadas2026/matches/${activeMatchId}`).set({ pts: finalPts, joker: joker }).then(() => {
                if(!state.history.includes(activeMatchId)) {
                    const newHistory = [...state.history, activeMatchId];
                    firebase.database().ref(`alentiadas2026/history`).set(newHistory);
                }
            });
            closeModal();
        }

        function startTimer(sec) {
            clearInterval(countdown);
            let t = sec;
            countdown = setInterval(() => {
                let m = Math.floor(t / 60); let s = t % 60;
                document.getElementById('timer_val').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(t <= 0) { clearInterval(countdown); alert("TEMPO ESGOTADO!"); }
                t--;
            }, 1000);
        }
        
        function stopTimer() { clearInterval(countdown); document.getElementById('timer_val').innerText = "00:00"; }
        function closeModal() { document.getElementById('modal_score').style.display = 'none'; }

        function toggleChart() {
            const modal = document.getElementById('modal_chart');
            if(modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                renderChart();
            }
        }

        function renderChart() {
            const ctx = document.getElementById('chart_canvas').getContext('2d');
            let labels = ["Início"];
            let d = {1:[0], 2:[0], 3:[0], 4:[0]};
            let running = {1:0, 2:0, 3:0, 4:0};

            const allGames = cats.flatMap(c => c.games);
            state.history.forEach(mid => {
                const m = state.matches[mid];
                const gameFound = allGames.find(x => x.id === mid);
                if(m && m.pts && gameFound) {
                    labels.push(gameFound.name);
                    for(let i=1; i<=4; i++) {
                        running[i] += (m.pts[i] || 0);
                        d[i].push(running[i]);
                    }
                }
            });

            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: state.names[1], data: d[1], borderColor: '#1d4ed8', tension: 0.2, fill: false },
                        { label: state.names[2], data: d[2], borderColor: '#ca8a04', tension: 0.2, fill: false },
                        { label: state.names[3], data: d[3], borderColor: '#15803d', tension: 0.2, fill: false },
                        { label: state.names[4], data: d[4], borderColor: '#db2777', tension: 0.2, fill: false }
                    ]
                },
                options: { maintainAspectRatio: false, responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function resetTourney() {
            if(confirm("Deseja apagar TODOS os dados e recomeçar as Alentíadas?")) {
                firebase.database().ref('alentiadas2026').set({
                    names: {1:"Equipa 1", 2:"Equipa 2", 3:"Equipa 3", 4:"Cunhado Solo"},
                    matches: {},
                    history: []
                });
            }
        }
    </script>
